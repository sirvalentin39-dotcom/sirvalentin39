
<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Перекладач Доповнень Minecraft</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://js.puter.com/v2/"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-primary': '#4CAF50',
              'brand-secondary': '#388E3C',
              'brand-background': '#121212',
              'brand-surface': '#1E1E1E',
              'brand-text-primary': '#E0E0E0',
              'brand-text-secondary': '#B0B0B0',
            },
            animation: {
              'fade-in': 'fadeIn 0.4s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
          },
        },
      }
    </script>
    <style>
      /* --- Мобільна адаптація / Telegram Mini App --- */
      html, body {
        height: 100%;
        overscroll-behavior-y: none;       /* без "гумового" відскоку та pull-to-refresh */
        -webkit-text-size-adjust: 100%;
      }
      body {
        /* Безпечні відступи для "чубчика"/жестового рядка телефонів */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100dvh;                /* динамічна висота вьюпорта для мобільних */
      }
      /* Зручні тач-таргети: не даємо кнопкам/інпутам бути надто дрібними */
      button, a[role="button"], label[for] {
        touch-action: manipulation;
      }
      /* iOS Safari масштабує сторінку при фокусі на input з font-size < 16px */
      input, textarea, select {
        font-size: 16px;
      }
      @media (min-width: 640px) {
        input, textarea, select { font-size: inherit; }
      }

      /* Custom scrollbar for Webkit browsers (Chrome, Safari, Edge) */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #1E1E1E; /* brand-surface */
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #4A5568; /* Tailwind gray-600 */
        border-radius: 4px;
        border: 2px solid #1E1E1E; /* brand-surface */
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: #718096; /* Tailwind gray-500 */
      }
      /* Custom scrollbar for Firefox */
      .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #4A5568 #1E1E1E;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0"
  }
}
</script>
</head>
  <body class="bg-brand-background text-brand-text-primary">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
